<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Stile 4 · Interattiva · MedX</title>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:200 800;font-display:swap;src:url(../assets/fonts/jakarta.woff2) format("woff2")}
@font-face{font-family:"Roboto";font-weight:400 500;font-display:swap;src:url(../assets/fonts/roboto.woff2) format("woff2")}
:root{--cupo:#0A2829;--pet:#00585C;--acqua:#2FB3A8;--oro:#C1AC80;--avorio:#F3EBDC;--nero:#16201F;--h:"Plus Jakarta Sans",system-ui,sans-serif;--b:Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--avorio);color:#2B3332;font:400 17px/1.6 var(--b);overflow-x:hidden}
.top{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.top img.l{height:16px;filter:brightness(0);opacity:.8}
.dott{margin-left:auto;display:flex;align-items:center;gap:9px;font:600 12px/1.25 var(--h);color:var(--nero);text-align:right}
.dott video{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--oro)}
.app{position:relative;height:100svh;display:flex;flex-direction:column;padding-bottom:var(--cass,0px);transition:padding .45s cubic-bezier(.2,.8,.2,1)}
.domanda{padding:calc(76px + env(safe-area-inset-top)) 20px 0;position:relative;z-index:4}
.passo{display:flex;gap:4px;margin-bottom:14px}.passo i{flex:1;height:3px;border-radius:2px;background:rgba(22,32,31,.12)}.passo i.on{background:var(--pet)}
.domanda h1{font:700 27px/1.12 var(--h);color:var(--nero);letter-spacing:-.025em}
.domanda p{font-size:14.5px;color:#6A706D;margin-top:6px}
.testa{position:relative;flex:1;min-height:0}
.testa img,.testa svg{position:absolute;inset:0;width:100%;height:100%}
.testa img{object-fit:contain;object-position:50% 50%;mix-blend-mode:multiply}
.zona{cursor:pointer}
.zona circle.alone{fill:var(--acqua);opacity:.0;transition:opacity .35s, r .35s}
.zona circle.punto{fill:#fff;stroke:var(--pet);stroke-width:5;transition:all .3s}
.zona circle.onda{fill:none;stroke:var(--pet);stroke-width:3;opacity:.6;transform-box:fill-box;transform-origin:center;animation:onda 2.2s ease-out infinite}
@keyframes onda{from{transform:scale(.6);opacity:.7}to{transform:scale(2.2);opacity:0}}
.zona text{font:700 24px/1 var(--h);fill:var(--cupo);letter-spacing:.04em;paint-order:stroke;stroke:var(--avorio);stroke-width:8px}
.zona.on circle.alone{opacity:.42}
.zona.on circle.punto{fill:var(--pet);stroke:#fff}
.zona.on circle.onda{display:none}
.diffuso{position:absolute;z-index:5;left:20px;bottom:8px;border:1px solid rgba(22,32,31,.25);background:rgba(243,235,220,.8);border-radius:999px;padding:11px 16px;font:600 14px/1 var(--h);color:var(--nero)}
.diffuso.on{background:var(--pet);color:#fff;border-color:var(--pet)}
.cassetto{position:fixed;z-index:8;left:0;right:0;bottom:0;background:var(--cupo);color:#E6E1D6;border-radius:22px 22px 0 0;padding:14px 22px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px -20px rgba(0,0,0,.4)}
.cassetto.su{transform:none}
.maniglia{width:40px;height:4px;border-radius:2px;background:rgba(230,225,214,.3);margin:0 auto 14px}
.cassetto .kick{font:700 11px/1 var(--h);letter-spacing:.2em;text-transform:uppercase;color:var(--oro)}
.cassetto h2{font:650 22px/1.2 var(--h);color:#fff;margin-top:8px}
.cassetto p{margin-top:8px;font-size:15.5px;color:rgba(230,225,214,.85)}
.cassetto p b{color:#fff;font-weight:500}
.cassetto .btn{display:flex;align-items:center;justify-content:center;margin-top:16px;min-height:54px;border-radius:999px;background:var(--avorio);color:var(--cupo);font:700 16.5px/1 var(--h);text-decoration:none;border:0;width:100%}
.nota{position:absolute;z-index:5;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));font:500 12px/1.3 var(--h);color:#6A706D;text-align:right;max-width:150px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><img class="l" src="../assets/logo-medx.png" alt="MedX Clinic">
  <div class="dott"><span>Le domande del<br>dott. Armenti</span><video src="media/sensori.mp4" poster="media/sensori.jpg" autoplay muted loop playsinline></video></div></header>
<main class="app">
  <div class="domanda">
    <div class="passo"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1>Dove senti di solito il dolore o la tensione?</h1>
    <p>Tocca la testa. Puoi sceglierne fino a due.</p>
  </div>
  <div class="testa">
    <img src="media/anatomia.jpg" alt="">
    <svg viewBox="0 0 700 806" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Zone della testa">
      <g class="zona" data-k="0" role="button" aria-label="Alle tempie"><circle class="alone" cx="335" cy="215" r="105"/><circle class="onda" cx="335" cy="215" r="18"/><circle class="punto" cx="335" cy="215" r="14"/><text x="300" y="175">TEMPIE</text></g>
      <g class="zona" data-k="1" role="button" aria-label="Alla nuca o al collo"><circle class="alone" cx="505" cy="455" r="90"/><circle class="onda" cx="505" cy="455" r="18"/><circle class="punto" cx="505" cy="455" r="14"/><text x="478" y="415">NUCA</text></g>
      <g class="zona" data-k="2" role="button" aria-label="Dietro gli occhi"><circle class="alone" cx="205" cy="315" r="70"/><circle class="onda" cx="205" cy="315" r="18"/><circle class="punto" cx="205" cy="315" r="14"/><text x="110" y="275">OCCHI</text></g>
      <g class="zona" data-k="3" role="button" aria-label="Alla mascella o alle guance"><circle class="alone" cx="385" cy="480" r="90"/><circle class="onda" cx="385" cy="480" r="18"/><circle class="punto" cx="385" cy="480" r="14"/><text x="300" y="560">MASCELLA</text></g>
    </svg>
    <button class="diffuso" data-k="4">Diffuso, difficile da dire</button>
  </div>
</main>
<div class="cassetto" id="cassetto" aria-live="polite"><div class="maniglia"></div><div class="kick">Cosa c’entra</div><h2 id="ct"></h2><p id="cp"></p><button class="btn">Avanti →</button></div>
<script>
var S=[['Le tempie','Il muscolo <b>temporale</b> è un ventaglio che occupa la tempia e scende verso la mandibola. È uno dei muscoli della masticazione, e la sua tensione si sente proprio in quella zona.'],
['La nuca e il collo','I muscoli <b>suboccipitali</b> collegano la base del cranio alle prime vertebre. Possono lavorare insieme ai muscoli della masticazione, oppure per conto loro.'],
['Dietro gli occhi','Il dolore riferito dietro l’occhio è descritto sia in quadri muscolari sia in altri tipi di cefalea. Da solo non orienta: conta insieme a cos’altro c’è.'],
['La mascella e le guance','Il <b>massetere</b> è il muscolo che chiude la mandibola, e si trova esattamente lì. In rapporto alla sua dimensione è fra i più potenti del corpo.'],
['Quando è diffuso','Un dolore che non si riesce a localizzare è un’informazione, non un’assenza di informazione: sposta le domande successive su cosa lo fa cambiare.']];
var scelte=[];
function tocca(k){var p=scelte.indexOf(k);if(p>=0)scelte.splice(p,1);else{scelte.push(k);if(scelte.length>2)scelte.shift()}
 document.querySelectorAll('[data-k]').forEach(function(z){z.classList.toggle('on',scelte.indexOf(+z.getAttribute('data-k'))>=0)});
 var c=document.getElementById('cassetto'),a=document.querySelector('.app');if(!scelte.length){c.classList.remove('su');a.style.setProperty('--cass','0px');return}
 var u=scelte[scelte.length-1];document.getElementById('ct').textContent=S[u][0];document.getElementById('cp').innerHTML=S[u][1];c.classList.add('su');a.style.setProperty('--cass',(c.offsetHeight-10)+'px')}
document.querySelectorAll('[data-k]').forEach(function(z){z.addEventListener('click',function(){tocca(+z.getAttribute('data-k'))})});
</script>
</body></html>
